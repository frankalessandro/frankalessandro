<svg xmlns="http://www.w3.org/2000/svg" width="370" height="370" viewBox="0 0 370 370">
  <style>
    .bg { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
    .mark {
      font: 700 96px JetBrains Mono, Consolas, monospace;
      fill: #2EA043;
    }
    .mark tspan {
      opacity: 0;
      animation: type-in 0.05s steps(1) forwards;
    }
    @keyframes type-in {
      to { opacity: 1; }
    }
    .cursor {
      fill: #2EA043;
      opacity: 1;
      animation: blink 1s steps(1) 1.35s 4;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .caption {
      fill: #8b949e;
      font: 13px JetBrains Mono, Consolas, monospace;
      opacity: 0;
      animation: fade-in 0.6s ease-out 1.35s forwards;
    }
    @keyframes fade-in {
      to { opacity: 1; }
    }
  </style>
  <rect class="bg" width="370" height="370" rx="8"/>
  <text class="mark" x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"><tspan style="animation-delay:0.00s">&lt;</tspan><tspan style="animation-delay:0.35s">/</tspan><tspan style="animation-delay:0.70s">&gt;</tspan></text>
  <rect class="cursor" x="273.0" y="152.4" width="10" height="60"/>
  <text class="caption" x="50%" y="80%" text-anchor="middle">frankalessandro</text>
</svg>