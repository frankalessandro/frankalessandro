<svg xmlns="http://www.w3.org/2000/svg" width="520" height="232" viewBox="0 0 520 232">
  <defs>
    <linearGradient id="glyph-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#2EA043"/>
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2EA043" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2EA043" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .bg { fill: #0d1117; stroke: #2EA043; stroke-width: 1; }
    .bar { fill: #161b22; }
    .dot { opacity: 0.55; }
    .title { fill: #2EA043; font: 600 12px JetBrains Mono, Consolas, monospace; }
    .glow-pulse {
      opacity: 0;
      transform-origin: center;
      transform: scale(0.8);
      animation: pulse-in 1.6s ease-out 0.2s forwards;
    }
    @keyframes pulse-in {
      to { opacity: 1; transform: scale(1); }
    }
    .glyph {
      fill: none;
      stroke: url(#glyph-grad);
      stroke-width: 17;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      filter: url(#soft-glow);
      animation: draw 0.9s cubic-bezier(.4,0,.2,1) forwards;
    }
    .glyph.left { animation-delay: 0.15s; }
    .glyph.slash { animation-delay: 0.45s; }
    .glyph.right { animation-delay: 0.75s; }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <rect class="bg" width="520" height="232" rx="8"/>
  <rect class="bar" width="520" height="32" rx="8"/>
  <rect class="bar" x="0" y="16" width="520" height="16"/>
  <circle class="dot" cx="20" cy="16" r="5" fill="#000000"/>
  <circle class="dot" cx="38" cy="16" r="5" fill="#000000"/>
  <circle class="dot" cx="56" cy="16" r="5" fill="#000000"/>
  <text class="title" x="260" y="20" text-anchor="middle">brand.svg</text>

  <circle class="glow-pulse" cx="260" cy="132" r="90" fill="url(#glow-grad)"/>

  <polyline class="glyph left" points="218.7,82.1 156.9,132 218.7,181.9"/>
  <line class="glyph slash" x1="241.5" y1="208.5" x2="278.5" y2="55.5"/>
  <polyline class="glyph right" points="301.3,82.1 363.1,132 301.3,181.9"/>
</svg>
